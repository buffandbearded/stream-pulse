[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
